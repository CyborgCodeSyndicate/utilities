name: Deploy to Maven Central

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (must match an existing git tag. Example: 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  deploy-central:
    name: Deploy to Maven Central
    runs-on: ubuntu-latest

    steps:
      # Use the composite action to deploy to Maven Central
      - name: Deploy Utilities to Maven Central
        uses: CyborgCodeSyndicate/utilities/pipelines/deploy-maven-central@main
        with:
          version: ${{ inputs.version }}
          # Deploy only parent-pom, commons, and shared-static-data
          # Do NOT deploy utilities (root) or pipelines modules
          modules: "shared-static-data,parent-pom,commons"
          java_version: "17"
          maven_central_username: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          maven_central_token: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg_passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Create GitHub Release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'RELEASE_NOTES'
          ## 📦 Maven Central Release

          Version `__VERSION__` has been deployed to Maven Central.

          ### Deployed Modules
          - `io.cyborgcode.utilities:parent-pom:__VERSION__`
          - `io.cyborgcode.utilities:commons:__VERSION__`
          - `io.cyborgcode.utilities:shared-static-data:__VERSION__`

          ### Usage
          Add the following to your `pom.xml`:
          ```xml
          <dependency>
            <groupId>io.cyborgcode.utilities</groupId>
            <artifactId>parent-pom</artifactId>
            <version>__VERSION__</version>
            <type>pom</type>
            <scope>import</scope>
          </dependency>
          ```

          Or for the commons module:
          ```xml
          <dependency>
            <groupId>io.cyborgcode.utilities</groupId>
            <artifactId>commons</artifactId>
            <version>__VERSION__</version>
          </dependency>
          ```

          ### Notes
          - Artifacts may take up to 30 minutes to appear in Maven Central
          - Search for artifacts: https://search.maven.org/search?q=g:io.cyborgcode.utilities
          RELEASE_NOTES
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "release-notes.md"
          path.write_text(path.read_text().replace("__VERSION__", os.environ["VERSION"]))
          PY
          args=("v$VERSION" --verify-tag --title "Release v$VERSION - Maven Central" --notes-file "$RUNNER_TEMP/release-notes.md")
          if [[ "$VERSION" == *-rc-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
